<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>우리 반 1인 1역할 배정기</title>
  <!-- 구글 웹폰트 (Jua & Noto Sans KR) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;600;700;800&display=swap" rel="stylesheet">
  <!-- 폭죽 효과 라이브러리 CDN -->
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    :root {
      /* 파스텔 민트 & 코랄 테마 팔레트 */
      --bg-mint-soft: #F2FAF8;
      --mint-primary: #32B596;
      --mint-hover: #26967B;
      --mint-light: #E0F4EE;
      --mint-border: #B7E8DB;
      
      --coral-primary: #FF7666;
      --coral-hover: #F05D4C;
      --coral-light: #FFEFEF;
      --coral-border: #FFCDCA;

      --card-bg: #FFFFFF;
      --text-main: #2C3E50;
      --text-muted: #64748B;
      --border-soft: #E2E8F0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: var(--bg-mint-soft);
      color: var(--text-main);
      padding: 24px 16px;
      min-height: 100vh;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 상단 헤더 */
    header {
      text-align: center;
      margin-bottom: 24px;
    }

    header h1 {
      font-family: 'Jua', sans-serif;
      font-size: 2.9rem;
      color: var(--coral-primary);
      text-shadow: 2px 2px 0px var(--mint-light);
      letter-spacing: 1px;
      margin-bottom: 6px;
    }

    header p {
      font-size: 1.25rem;
      color: var(--mint-hover);
      font-weight: 700;
    }

    /* 입력 영역 2분할 그리드 */
    .input-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-bottom: 20px;
    }

    @media (max-width: 768px) {
      .input-grid {
        grid-template-columns: 1fr;
      }
      header h1 {
        font-size: 2.2rem;
      }
    }

    .input-card {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px 22px;
      box-shadow: 0 6px 20px rgba(50, 181, 150, 0.08);
      border: 3px solid var(--mint-border);
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .card-title {
      font-family: 'Jua', sans-serif;
      font-size: 1.45rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .count-badge {
      font-size: 0.95rem;
      background-color: var(--mint-light);
      color: var(--mint-hover);
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: 700;
      border: 1px solid var(--mint-border);
    }

    textarea {
      width: 100%;
      height: 180px;
      border: 2px dashed #CBD5E0;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 1.15rem;
      line-height: 1.6;
      font-family: inherit;
      color: var(--text-main);
      resize: vertical;
      background-color: #FAFCFC;
      transition: all 0.2s ease;
    }

    textarea:focus {
      outline: none;
      border-color: var(--mint-primary);
      background-color: #FFF;
      box-shadow: 0 0 0 3px rgba(50, 181, 150, 0.2);
    }

    .helper-text {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-top: 6px;
      text-align: right;
    }

    /* 📌 사전 고정 핀 설정 섹션 */
    .pin-section {
      background: var(--card-bg);
      border-radius: 20px;
      padding: 20px 24px;
      margin-bottom: 24px;
      border: 3px solid var(--coral-border);
      box-shadow: 0 6px 20px rgba(255, 118, 102, 0.08);
    }

    .pin-inputs {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      align-items: center;
      margin-top: 10px;
    }

    .custom-select {
      flex: 1;
      min-width: 180px;
      padding: 10px 14px;
      font-size: 1.05rem;
      border: 2px solid var(--border-soft);
      border-radius: 12px;
      font-family: inherit;
      background: #FFF;
      color: var(--text-main);
      cursor: pointer;
    }

    .custom-select:focus {
      outline: none;
      border-color: var(--coral-primary);
    }

    .btn-pin-add {
      background-color: var(--coral-primary);
      color: #FFF;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 1.05rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .btn-pin-add:hover {
      background-color: var(--coral-hover);
      transform: translateY(-1px);
    }

    .pinned-list {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 14px;
      min-height: 32px;
    }

    .pin-tag {
      background: var(--coral-light);
      border: 1.5px solid var(--coral-border);
      color: #D34333;
      padding: 6px 12px;
      border-radius: 50px;
      font-size: 0.95rem;
      font-weight: 700;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      animation: popIn 0.2s ease;
    }

    .pin-tag button {
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: #D34333;
      font-weight: bold;
      display: flex;
      align-items: center;
    }

    /* 버튼 영역 */
    .action-container {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 16px;
      margin-bottom: 28px;
      flex-wrap: wrap;
    }

    .btn-assign {
      background: linear-gradient(135deg, var(--coral-primary), #FFA296);
      color: #FFF;
      font-family: 'Jua', sans-serif;
      font-size: 1.85rem;
      padding: 16px 42px;
      border: none;
      border-radius: 50px;
      cursor: pointer;
      box-shadow: 0 8px 22px rgba(255, 118, 102, 0.38);
      transition: transform 0.15s ease, box-shadow 0.15s ease;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-assign:hover:not(:disabled) {
      transform: translateY(-3px) scale(1.02);
      box-shadow: 0 12px 28px rgba(255, 118, 102, 0.45);
    }

    .btn-assign:disabled {
      opacity: 0.7;
      cursor: not-allowed;
      transform: none;
    }

    .btn-print {
      background: #FFF;
      color: var(--mint-hover);
      border: 2px solid var(--mint-primary);
      border-radius: 50px;
      padding: 14px 26px;
      font-family: 'Jua', sans-serif;
      font-size: 1.35rem;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(50, 181, 150, 0.15);
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn-print:hover {
      background: var(--mint-light);
      transform: translateY(-2px);
    }

    /* 결과 출력 영역 */
    .result-section {
      background: var(--card-bg);
      border-radius: 24px;
      padding: 30px;
      box-shadow: 0 8px 30px rgba(50, 181, 150, 0.08);
      border: 3px solid var(--mint-border);
      position: relative;
      min-height: 300px;
    }

    .result-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
      border-bottom: 2px dashed #E2E8F0;
      padding-bottom: 14px;
    }

    .result-title {
      font-family: 'Jua', sans-serif;
      font-size: 2rem;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 10px;
    }

    /* 🎲 3D 주사위 롤링 애니메이션 스테이지 */
    .dice-stage {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 50px 20px;
    }

    .dice-scene {
      width: 90px;
      height: 90px;
      perspective: 600px;
      margin-bottom: 24px;
    }

    .dice-cube {
      width: 100%;
      height: 100%;
      position: relative;
      transform-style: preserve-3d;
      animation: spinDice 0.45s infinite linear;
    }

    @keyframes spinDice {
      0% {
        transform: rotateX(0deg) rotateY(0deg) rotateZ(0deg) translateY(0);
      }
      50% {
        transform: rotateX(360deg) rotateY(540deg) rotateZ(180deg) translateY(-25px);
      }
      100% {
        transform: rotateX(720deg) rotateY(1080deg) rotateZ(360deg) translateY(0);
      }
    }

    .dice-face {
      position: absolute;
      width: 90px;
      height: 90px;
      background: #FFFFFF;
      border: 3px solid var(--coral-primary);
      border-radius: 18px;
      box-shadow: inset 0 0 10px rgba(255, 118, 102, 0.15);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      grid-template-rows: repeat(3, 1fr);
      padding: 8px;
    }

    .dice-dot {
      background-color: var(--coral-primary);
      border-radius: 50%;
      width: 15px;
      height: 15px;
      margin: auto;
    }

    /* 주사위 6면 3D 배치 (translateZ = 45px) */
    .face-1 { transform: rotateY(0deg) translateZ(45px); }
    .face-2 { transform: rotateY(180deg) translateZ(45px); }
    .face-3 { transform: rotateY(90deg) translateZ(45px); }
    .face-4 { transform: rotateY(-90deg) translateZ(45px); }
    .face-5 { transform: rotateX(90deg) translateZ(45px); }
    .face-6 { transform: rotateX(-90deg) translateZ(45px); }

    /* 면별 눈금 위치 */
    .face-1 .dice-dot { grid-area: 2 / 2; width: 22px; height: 22px; background-color: #E85A4D; }

    .face-2 .d1 { grid-area: 1 / 1; }
    .face-2 .d2 { grid-area: 3 / 3; }

    .face-3 .d1 { grid-area: 1 / 1; }
    .face-3 .d2 { grid-area: 2 / 2; }
    .face-3 .d3 { grid-area: 3 / 3; }

    .face-4 .d1 { grid-area: 1 / 1; }
    .face-4 .d2 { grid-area: 1 / 3; }
    .face-4 .d3 { grid-area: 3 / 1; }
    .face-4 .d4 { grid-area: 3 / 3; }

    .face-5 .d1 { grid-area: 1 / 1; }
    .face-5 .d2 { grid-area: 1 / 3; }
    .face-5 .d3 { grid-area: 2 / 2; }
    .face-5 .d4 { grid-area: 3 / 1; }
    .face-5 .d5 { grid-area: 3 / 3; }

    .face-6 .d1 { grid-area: 1 / 1; }
    .face-6 .d2 { grid-area: 2 / 1; }
    .face-6 .d3 { grid-area: 3 / 1; }
    .face-6 .d4 { grid-area: 1 / 3; }
    .face-6 .d5 { grid-area: 2 / 3; }
    .face-6 .d6 { grid-area: 3 / 3; }

    /* 주사위 그림자 */
    .dice-shadow {
      width: 75px;
      height: 16px;
      background: rgba(44, 62, 80, 0.15);
      border-radius: 50%;
      margin: 0 auto;
      animation: shadowPulse 0.45s infinite ease-in-out;
    }

    @keyframes shadowPulse {
      0%, 100% { transform: scale(1); opacity: 0.3; }
      50% { transform: scale(0.65); opacity: 0.15; }
    }

    .dice-message {
      font-family: 'Jua', sans-serif;
      font-size: 1.85rem;
      color: var(--coral-primary);
      margin-top: 14px;
      letter-spacing: 0.5px;
      animation: pulseText 0.8s infinite alternate ease-in-out;
    }

    @keyframes pulseText {
      0% { transform: scale(0.98); opacity: 0.9; }
      100% { transform: scale(1.02); opacity: 1; }
    }

    /* 배정 결과 그리드 (TV 최적화 & 가독성 조화) */
    .result-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
      gap: 16px;
    }

    .result-card {
      background: #FFFFFF;
      border: 2px solid #E4F3EE;
      border-radius: 18px;
      padding: 16px 20px;
      box-shadow: 0 4px 12px rgba(50, 181, 150, 0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 14px;
      animation: cardPopIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) both;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    .result-card:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(50, 181, 150, 0.12);
    }

    .result-card.pinned {
      border-color: var(--coral-border);
      background-color: #FFFAFA;
    }

    .student-info {
      display: flex;
      align-items: center;
      gap: 12px;
      flex-shrink: 0;
    }

    .student-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background-color: var(--mint-light);
      color: var(--mint-hover);
      font-weight: 800;
      font-size: 1.05rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1.5px solid var(--mint-border);
      flex-shrink: 0;
    }

    .result-card.pinned .student-badge {
      background-color: var(--coral-light);
      color: var(--coral-primary);
      border-color: var(--coral-border);
    }

    /* 학생 이름: 큼직하고 안정감 있게 */
    .student-name {
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text-main);
      letter-spacing: -0.3px;
      white-space: nowrap;
    }

    /* 역할 배지: 단어 줄바꿈 유지(keep-all) & 한눈에 쏙 들어오는 폰트 밸런스 */
    .role-badge-container {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 4px;
      flex-grow: 1;
      text-align: right;
    }

    .role-badge {
      background-color: var(--mint-light);
      color: var(--mint-hover);
      padding: 8px 16px;
      border-radius: 14px;
      font-weight: 700;
      font-size: 1.2rem;
      line-height: 1.35;
      text-align: center;
      border: 1.5px solid var(--mint-border);
      word-break: keep-all;
      overflow-wrap: break-word;
      max-width: 100%;
    }

    .role-badge.pinned {
      background-color: var(--coral-light);
      color: var(--coral-primary);
      border-color: var(--coral-border);
    }

    .pinned-indicator {
      font-size: 0.78rem;
      font-weight: 800;
      color: var(--coral-primary);
      background-color: #FFF;
      padding: 1px 7px;
      border-radius: 10px;
      border: 1px solid var(--coral-border);
      display: inline-block;
    }

    .empty-state {
      text-align: center;
      padding: 55px 20px;
      color: var(--text-muted);
      font-size: 1.3rem;
      font-weight: 600;
    }

    @keyframes cardPopIn {
      0% { opacity: 0; transform: scale(0.88); }
      100% { opacity: 1; transform: scale(1); }
    }

    @keyframes popIn {
      0% { opacity: 0; transform: scale(0.85); }
      100% { opacity: 1; transform: scale(1); }
    }

    /* 🖨️ A4 용지 인쇄 전용 스타일 */
    @media print {
      @page {
        size: A4 portrait;
        margin: 15mm 10mm;
      }

      body {
        background: #FFFFFF !important;
        padding: 0;
        color: #000;
      }

      .input-grid, .pin-section, .action-container, .helper-text, #assignStatus, .dice-stage {
        display: none !important;
      }

      .result-section {
        border: none !important;
        box-shadow: none !important;
        padding: 0 !important;
      }

      header {
        margin-bottom: 15px;
      }

      header h1 {
        font-size: 2.2rem;
        color: #000 !important;
        text-shadow: none !important;
      }

      header p {
        color: #555 !important;
        font-size: 1rem;
      }

      .result-title {
        font-size: 1.5rem;
        color: #000;
      }

      .result-grid {
        grid-template-columns: repeat(2, 1fr) !important;
        gap: 8px !important;
      }

      .result-card {
        border: 1.5px solid #666 !important;
        box-shadow: none !important;
        padding: 8px 12px !important;
        break-inside: avoid;
      }

      .student-name {
        font-size: 1.2rem !important;
        color: #000 !important;
      }

      .student-badge {
        background: #eee !important;
        color: #000 !important;
        border: 1px solid #aaa !important;
        width: 28px;
        height: 28px;
        font-size: 0.9rem;
      }

      .role-badge {
        background: #FFF !important;
        color: #000 !important;
        border: 1px solid #333 !important;
        font-size: 1.05rem !important;
        padding: 4px 10px !important;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <header>
      <h1>🏫 우리 반 1인 1역할 배정기</h1>
      <p>공정하고 신나는 우리 교실 당번 배정 시간!</p>
    </header>

    <!-- 입력창 영역 -->
    <div class="input-grid">
      <!-- 학생 목록 입력창 -->
      <div class="input-card">
        <div class="card-header">
          <h2 class="card-title">🧑‍🎓 학생 명단</h2>
          <span class="count-badge" id="studentCount">10명</span>
        </div>
        <textarea id="studentInput" placeholder="학생 이름을 줄바꿈(엔터)으로 입력해 주세요.">김민준
이서연
박도윤
최지우
정하은
강시우
윤수아
임지호
한예린
송우진</textarea>
        <span class="helper-text">줄바꿈(Enter)으로 한 명씩 구분됩니다.</span>
      </div>

      <!-- 역할 목록 입력창 -->
      <div class="input-card">
        <div class="card-header">
          <h2 class="card-title">📋 1인 1역할 목록</h2>
          <span class="count-badge" id="roleCount">10개</span>
        </div>
        <textarea id="roleInput" placeholder="역할 목록을 줄바꿈(엔터)으로 입력해 주세요.">칠판 지우기
우유 배부 도우미
분리수거 반장
창문 환기 요원
줄 서기 도우미
학급 문고 정리
급식 줄 안내
전등 및 냉난방기 지킴이
바닥 빗자루 담당
식물 사랑 물주기</textarea>
        <span class="helper-text">줄바꿈(Enter)으로 한 역할씩 구분됩니다.</span>
      </div>
    </div>

    <!-- 📌 사전 고정 핀 영역 -->
    <div class="pin-section">
      <div class="card-header">
        <h2 class="card-title" style="color: var(--coral-primary);">📌 사전 고정 핀 (지정 배정)</h2>
        <span style="font-size: 0.9rem; color: var(--text-muted);">미리 역할을 확정할 학생을 지정합니다.</span>
      </div>
      <div class="pin-inputs">
        <select id="pinStudentSelect" class="custom-select">
          <option value="">학생 선택</option>
        </select>
        <span style="font-size: 1.2rem; font-weight: bold; color: var(--coral-primary);">➡️</span>
        <select id="pinRoleSelect" class="custom-select">
          <option value="">역할 선택</option>
        </select>
        <button class="btn-pin-add" onclick="addPin()">📌 고정 추가</button>
      </div>
      <div id="pinnedList" class="pinned-list">
        <!-- 등록된 고정 핀 태그가 추가되는 곳 -->
      </div>
    </div>

    <!-- 액션 버튼 -->
    <div class="action-container">
      <button class="btn-assign" id="assignBtn" onclick="startDiceAssignment()">
        <span id="assignBtnIcon">🎲</span>
        <span id="assignBtnText">역할 랜덤 배정하기</span>
      </button>
      <button class="btn-print" onclick="window.print()">
        🖨️ A4 출력하기
      </button>
    </div>

    <!-- 배정 결과 영역 -->
    <div class="result-section">
      <div class="result-header">
        <h2 class="result-title">✨ 오늘의 배정 결과</h2>
        <span id="assignStatus" style="font-size: 1.05rem; color: var(--text-muted); font-weight: 700;"></span>
      </div>

      <!-- 🎲 2초 동안 돌아가는 입체 3D 주사위 스테이지 -->
      <div id="diceStage" class="dice-stage">
        <div class="dice-scene">
          <div class="dice-cube">
            <!-- 1번 면 -->
            <div class="dice-face face-1">
              <span class="dice-dot"></span>
            </div>
            <!-- 2번 면 -->
            <div class="dice-face face-2">
              <span class="dice-dot d1"></span>
              <span class="dice-dot d2"></span>
            </div>
            <!-- 3번 면 -->
            <div class="dice-face face-3">
              <span class="dice-dot d1"></span>
              <span class="dice-dot d2"></span>
              <span class="dice-dot d3"></span>
            </div>
            <!-- 4번 면 -->
            <div class="dice-face face-4">
              <span class="dice-dot d1"></span>
              <span class="dice-dot d2"></span>
              <span class="dice-dot d3"></span>
              <span class="dice-dot d4"></span>
            </div>
            <!-- 5번 면 -->
            <div class="dice-face face-5">
              <span class="dice-dot d1"></span>
              <span class="dice-dot d2"></span>
              <span class="dice-dot d3"></span>
              <span class="dice-dot d4"></span>
              <span class="dice-dot d5"></span>
            </div>
            <!-- 6번 면 -->
            <div class="dice-face face-6">
              <span class="dice-dot d1"></span>
              <span class="dice-dot d2"></span>
              <span class="dice-dot d3"></span>
              <span class="dice-dot d4"></span>
              <span class="dice-dot d5"></span>
              <span class="dice-dot d6"></span>
            </div>
          </div>
        </div>
        <div class="dice-shadow"></div>
        <p class="dice-message">🎲 두구두구... 역할을 공정하게 섞는 중입니다!</p>
      </div>

      <!-- 최종 결과 그리드 -->
      <div id="resultGrid" class="result-grid">
        <div class="empty-state" style="grid-column: 1 / -1;">
          상단의 <b>[🎲 역할 랜덤 배정하기]</b> 버튼을 누르면 주사위가 힘차게 굴러갑니다!
        </div>
      </div>
    </div>
  </div>

  <script>
    const studentInput = document.getElementById('studentInput');
    const roleInput = document.getElementById('roleInput');
    const studentCountBadge = document.getElementById('studentCount');
    const roleCountBadge = document.getElementById('roleCount');
    const pinStudentSelect = document.getElementById('pinStudentSelect');
    const pinRoleSelect = document.getElementById('pinRoleSelect');
    const pinnedList = document.getElementById('pinnedList');
    const assignBtn = document.getElementById('assignBtn');
    const assignBtnText = document.getElementById('assignBtnText');
    const assignBtnIcon = document.getElementById('assignBtnIcon');
    const diceStage = document.getElementById('diceStage');
    const resultGrid = document.getElementById('resultGrid');
    const assignStatus = document.getElementById('assignStatus');

    // 고정된 학생-역할 리스트: [{ student: '김민준', role: '칠판 지우기' }]
    let pinnedPairs = [];

    // 줄바꿈 텍스트 파싱
    function parseList(text) {
      return text.split('\n').map(s => s.trim()).filter(s => s.length > 0);
    }

    // 인원/역할 수 및 드롭다운 선택지 동기화
    function syncData() {
      const students = parseList(studentInput.value);
      const roles = parseList(roleInput.value);

      studentCountBadge.textContent = `${students.length}명`;
      roleCountBadge.textContent = `${roles.length}개`;

      // 텍스트에서 삭제된 고정 핀 항목 자동 정리
      pinnedPairs = pinnedPairs.filter(p => students.includes(p.student) && roles.includes(p.role));
      renderPinnedTags();

      // 드롭다운 채우기 (이미 고정된 항목은 제외)
      const pinnedStudents = pinnedPairs.map(p => p.student);
      const pinnedRoles = pinnedPairs.map(p => p.role);

      const curSelectedStudent = pinStudentSelect.value;
      const curSelectedRole = pinRoleSelect.value;

      pinStudentSelect.innerHTML = '<option value="">학생 선택</option>';
      students.forEach(s => {
        if (!pinnedStudents.includes(s)) {
          const opt = document.createElement('option');
          opt.value = s;
          opt.textContent = s;
          pinStudentSelect.appendChild(opt);
        }
      });
      pinStudentSelect.value = pinnedStudents.includes(curSelectedStudent) ? '' : curSelectedStudent;

      pinRoleSelect.innerHTML = '<option value="">역할 선택</option>';
      roles.forEach(r => {
        if (!pinnedRoles.includes(r)) {
          const opt = document.createElement('option');
          opt.value = r;
          opt.textContent = r;
          pinRoleSelect.appendChild(opt);
        }
      });
      pinRoleSelect.value = pinnedRoles.includes(curSelectedRole) ? '' : curSelectedRole;
    }

    studentInput.addEventListener('input', syncData);
    roleInput.addEventListener('input', syncData);

    // 고정 핀 추가
    function addPin() {
      const student = pinStudentSelect.value;
      const role = pinRoleSelect.value;

      if (!student || !role) {
        alert('고정할 학생과 역할을 모두 선택해 주세요!');
        return;
      }

      pinnedPairs.push({ student, role });
      syncData();
    }

    // 고정 핀 삭제
    function removePin(index) {
      pinnedPairs.splice(index, 1);
      syncData();
    }

    // 고정 핀 태그 렌더링
    function renderPinnedTags() {
      pinnedList.innerHTML = '';
      if (pinnedPairs.length === 0) {
        pinnedList.innerHTML = '<span style="font-size: 0.9rem; color: #94A3B8;">현재 고정된 역할이 없습니다.</span>';
        return;
      }

      pinnedPairs.forEach((pair, idx) => {
        const tag = document.createElement('div');
        tag.className = 'pin-tag';
        tag.innerHTML = `
          <span>📌 ${pair.student} ➡️ ${pair.role}</span>
          <button onclick="removePin(${idx})" title="고정 해제">✕</button>
        `;
        pinnedList.appendChild(tag);
      });
    }

    // Fisher-Yates 무작위 셔플
    function shuffleArray(array) {
      const arr = [...array];
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    // 🎲 2초간 주사위 롤링 후 배정 결과 표출
    function startDiceAssignment() {
      const students = parseList(studentInput.value);
      const roles = parseList(roleInput.value);

      if (students.length === 0) {
        alert('학생 명단을 입력해 주세요!');
        studentInput.focus();
        return;
      }

      if (roles.length === 0) {
        alert('역할 목록을 입력해 주세요!');
        roleInput.focus();
        return;
      }

      // 1. 고정된 대상과 랜덤 대상 분리
      const pinnedStudents = pinnedPairs.map(p => p.student);
      const pinnedRoles = pinnedPairs.map(p => p.role);

      const unpinnedStudents = students.filter(s => !pinnedStudents.includes(s));
      const unpinnedRoles = roles.filter(r => !pinnedRoles.includes(r));

      // 최종 무작위 셔플 매칭 준비
      const shuffledUnpinnedRoles = shuffleArray(unpinnedRoles);

      // 전체 학생 순서에 따른 최종 배정 맵 구축
      const finalAssignment = {};
      let unpinnedIdx = 0;

      students.forEach(st => {
        const pinMatch = pinnedPairs.find(p => p.student === st);
        if (pinMatch) {
          finalAssignment[st] = { role: pinMatch.role, isPinned: true };
        } else {
          const role = unpinnedIdx < shuffledUnpinnedRoles.length 
            ? shuffledUnpinnedRoles[unpinnedIdx] 
            : '자유 / 도우미';
          finalAssignment[st] = { role: role, isPinned: false };
          unpinnedIdx++;
        }
      });

      // 2. 버튼 비활성화 & 주사위 롤링 스테이지 활성화 (기존 결과 숨김)
      assignBtn.disabled = true;
      assignBtnIcon.textContent = '⏳';
      assignBtnText.textContent = '두구두구... 굴리는 중!';
      assignStatus.textContent = '주사위가 힘차게 굴러가는 중... 🎲';

      resultGrid.style.display = 'none';
      diceStage.style.display = 'flex';

      // 3. 정확히 2초 동안 주사위가 돌아간 후 주사위가 사라지고 결과 노출
      setTimeout(() => {
        // 주사위 숨김 & 결과 그리드 재활성화
        diceStage.style.display = 'none';
        resultGrid.style.display = 'grid';
        resultGrid.innerHTML = '';

        // 카드 렌더링 (가독성 & 조화 최적화)
        students.forEach((student, index) => {
          const isPinned = finalAssignment[student].isPinned;
          const assignedRole = finalAssignment[student].role;
          const card = document.createElement('div');
          card.className = `result-card ${isPinned ? 'pinned' : ''}`;
          card.style.animationDelay = `${index * 0.035}s`;
          
          card.innerHTML = `
            <div class="student-info">
              <span class="student-badge">${index + 1}</span>
              <span class="student-name">${student}</span>
            </div>
            <div class="role-badge-container">
              ${isPinned ? '<span class="pinned-indicator">📌 사전고정</span>' : ''}
              <div class="role-badge ${isPinned ? 'pinned' : ''}">
                ${assignedRole}
              </div>
            </div>
          `;
          resultGrid.appendChild(card);
        });

        // 버튼 상태 복원
        assignBtn.disabled = false;
        assignBtnIcon.textContent = '🎲';
        assignBtnText.textContent = '역할 다시 배정하기';

        const now = new Date();
        assignStatus.textContent = `배정 완료 (${now.getHours()}시 ${now.getMinutes()}분)`;

        // 🎉 꽃가루(Confetti) 축하 효과 발사
        launchCelebrationConfetti();
      }, 2000);
    }

    // 🎉 민트 & 코랄 듀얼 캐논 꽃가루 폭죽
    function launchCelebrationConfetti() {
      if (typeof confetti !== 'function') return;

      const colors = ['#32B596', '#FF7666', '#FFD166', '#A0E4CB', '#FFEFEF'];

      // 좌측 발사
      confetti({
        particleCount: 70,
        angle: 60,
        spread: 75,
        origin: { x: 0, y: 0.7 },
        colors: colors
      });

      // 우측 발사
      confetti({
        particleCount: 70,
        angle: 120,
        spread: 75,
        origin: { x: 1, y: 0.7 },
        colors: colors
      });

      // 중앙 2차 버스트
      setTimeout(() => {
        confetti({
          particleCount: 90,
          spread: 100,
          origin: { y: 0.6 },
          colors: colors
        });
      }, 250);
    }

    // 초기 동기화 실행
    syncData();
  </script>
</body>
</html>
